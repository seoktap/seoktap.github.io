<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F4F1EA">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='9' y='22' width='14' height='5' rx='1' fill='%23A9CDB0'/%3E%3Crect x='11' y='16' width='10' height='5' rx='1' fill='%23C9DFF0'/%3E%3Crect x='13' y='11' width='6' height='4' rx='1' fill='%23F3DDA9'/%3E%3Crect x='15' y='5' width='2' height='5' rx='1' fill='%23F5CFD3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  {% seo %}
  {% feed_meta %}
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <a class="skip" href="#main">본문으로 건너뛰기</a>

  <header class="top">
    <div class="col">
      <a class="brand" href="{{ '/' | relative_url }}">석탑 읽기</a>
      <nav aria-label="메뉴">
        <a class="nav-link{% if page.url == '/archive/' %} is-active{% endif %}" href="{{ '/archive/' | relative_url }}">읽은 탑</a>
        <a class="nav-link{% if page.url == '/catalog/' %} is-active{% endif %}" href="{{ '/catalog/' | relative_url }}">전체 목록</a>
      </nav>
    </div>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer class="foot">
    <div class="col">
      <a href="{{ '/archive/' | relative_url }}">읽은 탑</a>
      <a href="{{ '/catalog/' | relative_url }}">전체 목록</a>
      <a href="{{ '/feed.xml' | relative_url }}">RSS로 구독하기</a>
    </div>
  </footer>
</body>
</html>
